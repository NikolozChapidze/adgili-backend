spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

adgili.jwt.secret=test-secret-this-must-be-at-least-32-bytes-long-for-hs256-ok
adgili.jwt.access-token-ttl-minutes=60
adgili.jwt.refresh-token-ttl-days=7

adgili.cors.allowed-origins=http://localhost:3000

# Keep stubs on for tests
adgili.features.email-stub=true
adgili.features.sms-stub=true
adgili.features.identity-auto-approve=true

# Disable Redis for tests (falls back to in-memory OTP/token store)
spring.data.redis.url=redis://127.0.0.1:1
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

logging.level.org.hibernate.SQL=WARN
