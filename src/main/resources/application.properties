spring.application.name=adgili-api

# Server
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/adgili}
spring.datasource.username=${DATABASE_USERNAME:adgili}
spring.datasource.password=${DATABASE_PASSWORD:adgili}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis (optional; degrades gracefully if missing)
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Security / JWT (override in prod)
adgili.jwt.secret=${JWT_SECRET:dev-secret-change-me-this-must-be-at-least-32-bytes-long-ok}
adgili.jwt.access-token-ttl-minutes=60
adgili.jwt.refresh-token-ttl-days=30
adgili.jwt.issuer=adgi.li

# CORS
adgili.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://adgi.li}

# Feature flags (stubs for MVP)
adgili.features.email-stub=true
adgili.features.sms-stub=true
adgili.features.identity-auto-approve=true
adgili.features.payments-stub=true

# OTP (dev only)
adgili.dev.fixed-otp=000000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.root=INFO
logging.level.li.adgi=DEBUG
logging.level.org.springframework.security=INFO
