# Dev profile: activates seed data, verbose logging, dev stubs
spring.config.activate.on-profile=dev

spring.datasource.url=jdbc:postgresql://localhost:5432/adgili
spring.datasource.username=adgili
spring.datasource.password=adgili

logging.level.li.adgi=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

adgili.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080
