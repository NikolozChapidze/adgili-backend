name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (no tests)
        run: ./mvnw -B --no-transfer-progress clean package -DskipTests

      - name: Run tests (Testcontainers)
        run: ./mvnw -B --no-transfer-progress test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adgili-backend-jar
          path: target/adgili-backend.jar
          retention-days: 7

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t adgili-api:ci .
